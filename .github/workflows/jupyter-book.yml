# Jupyter Book (MyST) GitHub Pages Deploy
# Ensure your GitHub Pages settings for this repository are set to deploy with GitHub Actions.
# On push to main, syncs myst.yml TOC with notebooks on disk, then builds and deploys.
# myst.yml is not auto-committed (main is protected); run .github/sync-myst-toc.py locally
# and open a PR if the sync step reports drift.

name: Jupyter Book (MyST) GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Asset paths must match the GitHub Pages subfolder for this repository.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync myst.yml TOC with notebooks
        run: |
          pip install pyyaml --quiet
          python3 .github/sync-myst-toc.py
      - name: Check myst.yml is up to date
        run: |
          if ! git diff --exit-code myst.yml >/dev/null; then
            echo "::warning::myst.yml is out of sync with notebooks on disk."
            echo "Run 'python .github/sync-myst-toc.py' locally, commit myst.yml, and open a PR."
            git diff myst.yml
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        run: jupyter-book build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
